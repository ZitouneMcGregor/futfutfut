input {

  file {
    path => "/var/log/nginx/*.log"     # Chemin monté en volume
    start_position => "beginning"
    sincedb_path => "/dev/null"        # Évite de marquer la position. Utile pour tests
  }
  

}

filter {

  grok {
    match => { "message" => "%{COMBINEDAPACHELOG}" }
  }
  

  date {
    match => [ "timestamp", "dd/MMM/yyyy:HH:mm:ss Z" ]
    remove_field => [ "timestamp" ]
  }
}

output {

  elasticsearch {
    hosts => ["elasticsearch:9200"]
    index => "nginx-logs-%{+YYYY.MM.dd}"
  }
  

  stdout {
    codec => rubydebug
  }
}

