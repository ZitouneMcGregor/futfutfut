events {
    worker_connections 1024;
}

http {
    upstream angular_apps {
        server angular_app1:80 max_fails=3 fail_timeout=30s;
        server angular_app2:80 max_fails=3 fail_timeout=30s;
    }

    upstream spring_apps {
        server spring_app1:8080 max_fails=3 fail_timeout=30s;
        server spring_app2:8080 max_fails=30 fail_timeout=30s;
    }

    server {
        listen 80;
        
        # Front Angular
        location / {
            proxy_pass http://angular_apps;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Back Spring
        location /joueurs {
            proxy_pass http://spring_apps;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}

